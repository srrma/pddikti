name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: Offline checks on ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Self check
        run: python3 tests/test_render.py
      - name: Install from the checkout
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install .
      - name: Console script is on PATH
        run: pddikti --help
